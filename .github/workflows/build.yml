name: Build

# Windows, Mac and iPad builds of PERFORMLIVE BETA (Testing), on every push.
#
#   windows -- the Inno Setup installer. Steinberg's ASIO SDK and Microsoft's
#              WebView2 SDK are downloaded from their publishers during the
#              build and never committed (the ASIO licence keeps the SDK
#              itself out of a public repository).
#   macos   -- the signed, notarised .pkg. The certificate steps follow the
#              studio's macOS Code Signing & Notarisation Standard (proven on
#              SecondOut 1.3.2).
#   ipad    -- the signed App Store build of com.amanorsac.performlive (an
#              explicit, registered bundle id), uploaded to TestFlight. No
#              simulator: the device build is the check. Signing follows
#              PulseRoom's TestFlight job.
#
# This repository is public, so Actions minutes on standard runners are free.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (installer)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Fetched per build, never committed. Each download is checked for what
      # the build needs from it, so a moved or changed download fails here,
      # loudly, instead of producing an installer without ASIO.
      - name: Fetch the ASIO and WebView2 SDKs
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = Join-Path $env:RUNNER_TEMP "sdks"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null

          $asioZip = Join-Path $sdk "asio.zip"
          $got = $false
          foreach ($url in "https://www.steinberg.net/asiosdk",
                           "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip") {
            try {
              Invoke-WebRequest $url -OutFile $asioZip -MaximumRedirection 5
              $magic = [System.IO.File]::ReadAllBytes($asioZip)[0..1]
              if ($magic[0] -eq 0x50 -and $magic[1] -eq 0x4B) { Write-Host "ASIO SDK from $url"; $got = $true; break }
            } catch { Write-Host "  $url failed: $($_.Exception.Message)" }
          }
          if (-not $got) { Write-Error "Could not download Steinberg's ASIO SDK"; exit 1 }
          Expand-Archive $asioZip -DestinationPath (Join-Path $sdk "asio")
          $hdr = Get-ChildItem (Join-Path $sdk "asio") -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $hdr) { Write-Error "The ASIO SDK download has no common/iasiodrv.h"; exit 1 }
          $asioRoot = $hdr.Directory.Parent.FullName

          $wv2Zip = Join-Path $sdk "webview2.zip"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2" -OutFile $wv2Zip
          $wv2Root = Join-Path $sdk "webview2"
          Expand-Archive $wv2Zip -DestinationPath (Join-Path $wv2Root "Microsoft.Web.WebView2")
          if (-not (Get-ChildItem $wv2Root -Recurse -Filter WebView2LoaderStatic.lib | Select-Object -First 1)) {
            Write-Error "The WebView2 package has no WebView2LoaderStatic.lib"; exit 1
          }

          "ASIO_SDK_DIR=$($asioRoot.Replace('\','/'))" >> $env:GITHUB_ENV
          "WEBVIEW2_DIR=$($wv2Root.Replace('\','/'))"  >> $env:GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build_release -A x64 `
                "-DASIO_SDK_DIR=$env:ASIO_SDK_DIR" `
                "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:WEBVIEW2_DIR" `
                "-DPERFORMLIVE_BUILD_NUMBER=${{ github.run_number }}" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # CMakeLists.txt: never ship a Windows build that could not see
          # multi-output interfaces.
          if (-not (Select-String -Path configure.log -Pattern "ASIO: enabled" -Quiet)) {
            Write-Error "Configured without ASIO - refusing to build the Windows installer"; exit 1
          }

      - name: Build
        run: |
          cmake --build build_release --config Release --target EzPlay -- /m /v:minimal 2>&1 | Tee-Object -FilePath build.log | Select-String -Pattern "error |PerformLive.exe"
          if (-not (Test-Path build_release/EzPlay_artefacts/Release/PerformLive.exe)) {
            Select-String -Path build.log -Pattern "error " | Select-Object -First 60; exit 1
          }

      - name: In-app self-tests
        run: |
          $exe = "build_release/EzPlay_artefacts/Release/PerformLive.exe"
          foreach ($suite in "beta", "persistence", "library", "importer") {
            $out  = & $exe "--selftest-$suite" 2>&1 | Out-String
            $pass = ([regex]::Matches($out, '\[PASS\]')).Count
            $fail = ([regex]::Matches($out, '\[FAIL\]')).Count
            if ($fail -gt 0 -or $pass -eq 0) { $out; Write-Error "--selftest-${suite}: $pass passed, $fail failed"; exit 1 }
            Write-Host "--selftest-${suite}: PASS ($pass checks)"
          }

      # Inno Setup 6.6 or later for the dark wizard style; the runner image may
      # carry an older one.
      - name: Install Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: Package the installer
        run: ./package_release.ps1 -SkipBuild

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PerformLive-Windows
          path: dist/PerformLive-*-Windows.exe
          if-no-files-found: error

  macos:
    name: Mac (signed + notarised installer)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Developer ID Application - signs PerformLive.app.
      DEV_ID_APP_P12:            ${{ secrets.MAC_CERT_P12 }}
      DEV_ID_APP_P12_PASSWORD:   ${{ secrets.MAC_CERT_PASSWORD }}
      # Developer ID Installer - a DIFFERENT certificate, signs the .pkg.
      DEV_ID_INST_P12:           ${{ secrets.MAC_INSTALLER_P12 }}
      DEV_ID_INST_P12_PASSWORD:  ${{ secrets.MAC_INSTALLER_PASSWORD }}
      APPLE_TEAM_ID:             ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_P8:                ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID:                ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:             ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The engine is plain C++17 with no JUCE, so its suites build in seconds.
      # Expected counts match verify_batch.sh on Windows; a drift is a failure.
      - name: Engine tests
        run: |
          set -u
          for suite in decktest:67 switchtest:69 stemlentest:9 stemplaytest:15 stemlocktest:18 outroutetest:17 sectiontest:41 arrangetest:37 tempotest:11 clicktest:18 stretchtest:10 tempochangetest:11; do
            name="${suite%%:*}"; want="${suite##*:}"
            clang++ -std=c++17 -O2 -I. "$name.cpp" -o "$RUNNER_TEMP/$name" || { echo "::error::$name does not compile"; exit 1; }
            out="$("$RUNNER_TEMP/$name" 2>&1)"
            pass=$(printf '%s\n' "$out" | grep -c '\[PASS\]' || true)
            fail=$(printf '%s\n' "$out" | grep -c '\[FAIL\]' || true)
            if [ "$fail" -ne 0 ] || [ "$pass" -ne "$want" ]; then
              printf '%s\n' "$out" | grep '\[FAIL\]' || true
              echo "::error::$name: $pass of $want passed, $fail failed"
              exit 1
            fi
            echo "$name: $pass/$want PASS"
          done

      # A missing secret must not quietly produce an unsigned build that looks
      # like a release. A tag hard-fails; anything else warns and labels the
      # package UNSIGNED.
      - name: Require signing material
        id: gate
        run: |
          missing=()
          [ -n "$DEV_ID_APP_P12" ]           || missing+=(MAC_CERT_P12)
          [ -n "$DEV_ID_APP_P12_PASSWORD" ]  || missing+=(MAC_CERT_PASSWORD)
          [ -n "$DEV_ID_INST_P12" ]          || missing+=(MAC_INSTALLER_P12)
          [ -n "$DEV_ID_INST_P12_PASSWORD" ] || missing+=(MAC_INSTALLER_PASSWORD)
          [ -n "$APPLE_TEAM_ID" ]            || missing+=(APPLE_TEAM_ID)
          [ -n "$ASC_KEY_P8" ]               || missing+=(ASC_KEY_P8)
          [ -n "$ASC_KEY_ID" ]               || missing+=(ASC_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ]            || missing+=(ASC_ISSUER_ID)

          if [ ${#missing[@]} -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarisation enabled."
            exit 0
          fi

          echo "sign=false" >> "$GITHUB_OUTPUT"
          printf 'Missing secret: %s\n' "${missing[@]}"
          echo "::warning::Unsigned Mac build - the secrets above resolved empty. Organisation secrets must have visibility that includes this public repository."
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::Refusing to publish an unsigned build for tag ${{ github.ref_name }}."
            exit 1
          fi

      - name: Import signing certificates
        if: steps.gate.outputs.sign == 'true'
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          # Only the shape of a bad secret is ever reported, never its value.
          decode_p12 () {
            raw="$1"; out="$2"; name="$3"
            stripped=$(printf '%s' "$raw" | tr -d '[:space:]')
            if [ -z "$stripped" ]; then echo "::error::$name is empty."; return 1; fi
            case "$stripped" in
              -----BEGIN*) echo "::error::$name holds PEM text, but a base64-encoded .p12 is required."; return 1 ;;
            esac
            if ! printf '%s' "$stripped" | base64 --decode > "$out" 2>/dev/null || [ ! -s "$out" ]; then
              echo "::error::$name is not valid base64 (${#stripped} characters). It should hold the file's contents, not its name."
              return 1
            fi
            if [ "$(head -c 1 "$out" | xxd -p)" != "30" ]; then
              echo "::error::$name decoded, but is not a PKCS#12 archive (probably a .cer/.pem with no private key)."
              return 1
            fi
            echo "  $name: decoded OK ($(wc -c < "$out" | tr -d ' ') bytes)"
          }

          echo "Checking certificate secrets:"
          decode_p12 "$DEV_ID_APP_P12"  app.p12       MAC_CERT_P12
          decode_p12 "$DEV_ID_INST_P12" installer.p12 MAC_INSTALLER_P12

          trim () { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          security import app.p12       -k "$KEYCHAIN" -P "$(trim "$DEV_ID_APP_P12_PASSWORD")"  -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k "$KEYCHAIN" -P "$(trim "$DEV_ID_INST_P12_PASSWORD")" -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f app.p12 installer.p12

          # Without this, codesign blocks on a GUI prompt and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          echo "Identities available to this build:"
          security find-identity -v | sed 's/^/  /'

      - name: Configure
        run: |
          COMMON=(-S . -B build -G Xcode
                  -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
                  -DPERFORMLIVE_BUILD_NUMBER="${{ github.run_number }}")
          if [ "${{ steps.gate.outputs.sign }}" = "true" ]; then
            # Xcode signs at build time and applies JUCE's hardened-runtime
            # entitlements. INJECT_BASE_ENTITLEMENTS=NO keeps get-task-allow out.
            cmake "${COMMON[@]}" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="Developer ID Application" \
              -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              -DCMAKE_XCODE_ATTRIBUTE_OTHER_CODE_SIGN_FLAGS="--timestamp" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
          else
            cmake "${COMMON[@]}"
          fi

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target EzPlay 2>&1 | tee build.log | grep -E "error:|warning: unused|BUILD (SUCCEEDED|FAILED)" || true
          # The bundle folder exists even when linking failed, so check the
          # executable itself -- otherwise a compile error only shows up later
          # as "code object is not signed at all".
          test -f build/EzPlay_artefacts/Release/PerformLive.app/Contents/MacOS/PerformLive \
            || { grep -B2 -A8 "error:" build.log | head -150; exit 1; }

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^project(EzPlay VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: In-app self-tests and bundled files
        run: |
          APP=build/EzPlay_artefacts/Release/PerformLive.app
          # Without an explicit minimum, Xcode targets its own SDK's macOS and
          # the app refuses to open on anything older. Owner: "it should work on
          # older Macs" -- 10.13 High Sierra, the lowest current Xcode builds for.
          BIN="$APP/Contents/MacOS/PerformLive"
          echo "Architectures: $(lipo -archs "$BIN")"
          # Per slice: Intel carries the real floor (a target below 10.14 is
          # written as LC_VERSION_MIN_MACOSX "version", not LC_BUILD_VERSION
          # "minos"); Apple Silicon can never be below 11.0, the first macOS
          # that ran on it.
          minos_of () { vtool -arch "$1" -show-build "$BIN" | awk '$1 == "minos" || $1 == "version" {print $2; exit}'; }
          INTEL=$(minos_of x86_64); ARM=$(minos_of arm64)
          echo "Minimum macOS: Intel $INTEL, Apple Silicon $ARM"
          [ "$INTEL" = "10.13" ] || { echo "::error::Intel minimum macOS is '$INTEL', expected 10.13"; exit 1; }
          [ "$ARM" = "11.0" ]    || { echo "::error::Apple Silicon minimum macOS is '$ARM', expected 11.0"; exit 1; }
          for f in fonts/Inter-Regular.ttf fonts/SpaceGrotesk-Bold.ttf art/creators-qr.jpg art/amanorsac-logo.jpg art/dial-face.png logo.png; do
            test -f "$APP/Contents/Resources/$f" || { echo "::error::$f is missing from Contents/Resources"; exit 1; }
          done
          for suite in beta persistence library importer; do
            if perl -e 'alarm 180; exec @ARGV' "$APP/Contents/MacOS/PerformLive" --selftest-$suite > "self_$suite.log" 2>&1; then
              echo "--selftest-$suite: PASS ($(grep -c '\[PASS\]' "self_$suite.log") checks)"
            else
              cat "self_$suite.log"; echo "::error::--selftest-$suite failed"; exit 1
            fi
          done

      - name: Verify app signature
        if: steps.gate.outputs.sign == 'true'
        run: |
          APP=build/EzPlay_artefacts/Release/PerformLive.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::not signed with the hardened runtime - notarisation would reject it."; exit 1; }
          codesign --display --verbose=4 "$APP" 2>&1 | grep -q "^Timestamp=" \
            || { echo "::error::no secure timestamp - notarisation would reject it."; exit 1; }
          if codesign --display --entitlements - --xml "$APP" 2>/dev/null | grep -q "get-task-allow"; then
            echo "::error::carries com.apple.security.get-task-allow - notarisation would reject it."; exit 1
          fi
          lipo -archs "$APP/Contents/MacOS/PerformLive"

      - name: Assemble installer package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ROOT=pkgroot
          mkdir -p "$ROOT/Applications"
          cp -R build/EzPlay_artefacts/Release/PerformLive.app "$ROOT/Applications/"

          # Not relocatable: otherwise Installer "upgrades" any other copy with
          # the same bundle id wherever it sits (a download folder, a build
          # folder) and /Applications stays empty.
          pkgbuild --analyze --root "$ROOT" component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist

          pkgbuild --root "$ROOT" \
                   --component-plist component.plist \
                   --identifier com.amanorsac.performlive.installer \
                   --version "$VERSION" \
                   --install-location / \
                   "PerformLive-$VERSION-unsigned.pkg"

      - name: Sign, notarise and staple the installer
        if: steps.gate.outputs.sign == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="PerformLive-$VERSION-macOS.pkg"

          productsign --sign "Developer ID Installer" "PerformLive-$VERSION-unsigned.pkg" "$PKG"
          rm -f "PerformLive-$VERSION-unsigned.pkg"
          pkgutil --check-signature "$PKG"

          printf '%s' "$ASC_KEY_P8" | base64 --decode > asc.p8 2>/dev/null || true
          grep -q "BEGIN PRIVATE KEY" asc.p8 2>/dev/null || printf '%s' "$ASC_KEY_P8" > asc.p8
          grep -q "BEGIN PRIVATE KEY" asc.p8 \
            || { echo "::error::ASC_KEY_P8 is neither base64-encoded nor a raw .p8 private key."; rm -f asc.p8; exit 1; }
          trap 'rm -f asc.p8' EXIT

          # notarytool --wait exits 0 even when Apple says "Invalid".
          set +e
          RESULT=$(xcrun notarytool submit "$PKG" \
                     --key asc.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
                     --wait --timeout 30m --output-format json)
          set -e
          echo "$RESULT"
          SUBMISSION_ID=$(printf '%s' "$RESULT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          STATUS=$(printf '%s' "$RESULT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Apple returned notarisation status '$STATUS'. Its log follows."
            [ -n "$SUBMISSION_ID" ] && xcrun notarytool log "$SUBMISSION_ID" --key asc.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            exit 1
          fi

          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          spctl --assess -vv --type install "$PKG"

      - name: Name the unsigned package honestly
        if: steps.gate.outputs.sign != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv "PerformLive-$VERSION-unsigned.pkg" "PerformLive-$VERSION-macOS-UNSIGNED.pkg"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PerformLive-${{ steps.version.outputs.version }}-macOS
          path: PerformLive-*.pkg
          if-no-files-found: error

      - name: Clean up keychain
        if: always() && steps.gate.outputs.sign == 'true'
        run: security delete-keychain build.keychain || true

  ipad:
    name: iPad (signed + TestFlight)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (iPadOS)
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DPERFORMLIVE_BUILD_NUMBER="${{ github.run_number }}"

      # The device build for com.amanorsac.performlive, signed with the Apple
      # Distribution certificate, exported and uploaded to TestFlight.
      - name: Signed archive and TestFlight upload
        id: testflight
        env:
          APPLE_TEAM_ID:  ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8:     ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          # The organisation holds its Apple Distribution certificate under one
          # of these names (Nebula Tide uses the first, SecondOut's notes name
          # the second). Whichever imports with a private key is used.
          DIST_P12_A:     ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_P12_B:     ${{ secrets.APPLE_DIST_P12 }}
          DIST_PW_A:      ${{ secrets.IOS_CERT_PASSWORD }}
          DIST_PW_B:      ${{ secrets.APPLE_DIST_PASSWORD }}
          DIST_PW_C:      ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: bash tools/ci_ipad_testflight.sh

      - name: Upload iPad build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PerformLive-iPad
          path: PerformLive-*-iPad.ipa
          if-no-files-found: ignore
